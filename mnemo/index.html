{id:"MN-0003",t:"Standard otworowania pod puszki Ø68 mm (na sucho)",tu:"Стандарт свердління під підрозетники Ø68 мм (насухо)",c:"Narzędzia i materiały eksploatacyjne",tags:"#koronka #puszki #68mm #beton #silka #porotherm #ytong #gips",b:`Standard EL'KADRA: puszki Ø68 mm, wiercenie na sucho. Młotowiertarka SDS+ (sieciowa albo akumulatorowa), zawsze bez udaru (wyjątek: Distar CS-X w wiertnicy z mikroudarem).

ŚCIĄGAWKA
• Żelbet, beton, silikat (Silka) → Distar CS-X Ø68, 4 segmenty, adapter M16 / SDS Plus. Zapas: Distar RS-X (tylko silka, bez mikroudaru).
• Porotherm, pustak ceramiczny, cegła pełna → Baumesser Krone Pro DDS-W Ø68, 4 segmenty, adapter M16 / SDS Plus. Zapas: S&R Ø68 SDS+ albo Tvardy Turbo.
• Ytong (gazobeton), bloczki gipsowe, G-K → Bosch EXPERT Construction Material Ø68, węglik HM/TCT, Power Change Plus SDS+. Zapas: Dedra 08X068 TCT (gwint 5/8").

DISTAR CS-X (twarde ściany)
Ciężki i zbrojony beton, twarde nadproża, gęste bloczki silikatowe. Nie wiercić w Porothermie, cegle ani Ytongu: miękkie spoiwo (pod zbrojenie) szybko ściera się w ściernym pyle ceramicznym. Zwykłą SDS+ bez mikroudaru: nie dociskać na siłę, lekko kołysać koroną na boki, żeby odprowadzać pył i łatwiej nacinać pręty.

BAUMESSER KRONE PRO (ceramika)
Większe budowy w ceramice poryzowanej, pustakach i cegle pełnej. Budżetowa linia z fabryk Distara: dobra osiowość (bez bicia, które wyrywa cienkie ścianki Porothermu) i zapas na twardszą zaprawę albo betonowe nadproże, w cenie ponad 2× niższej niż CS-X. Korona bez trzpienia: nakręcamy ją na adapter M16→SDS+ z zestawu CS-X.

BOSCH EXPERT CONSTRUCTION MATERIAL (materiały miękkie)
Ściany działowe i nośne z gazobetonu oraz bloczków gipsowych. Duże zęby z węglika i głębokie szczeliny wiórowe nie zaklejają się pyłem gipsowym, a Power Change Plus pozwala zdjąć koronę jednym kliknięciem i wypchnąć krążek. Pojedyncze otwory w Porothermie też da radę, tylko na niskich obrotach i bez szarpania.

Zasady pracy (bez udaru, wiertło centrujące, ostrzenie): MN-0004. Modele, indeksy i ceny: tabela koronek.`,src:"Standard firmowy EL'KADRA (Karol). Bosch: karta produktu 2608900470",link:"https://www.bosch-professional.com/eg/en/expert-construction-material-pc-plus-hole-saw-2867211-ocs-ac",st:"do sprawdzenia",rel:"MN-0004, MN-0005",tab:"tabele",ig:"koronki"},
{id:"MN-0004",t:"Koronki pod puszki: złote zasady pracy",tu:"Коронки під підрозетники: золоті правила роботи",c:"Narzędzia i materiały eksploatacyjne",tags:"#koronka #bez-udaru #BHP #ostrzenie #wiertło-centrujące",b:`1. BEZ UDARU. W SDS+ zawsze samo wiercenie. Udar urywa segmenty diamentowe (Distar, Baumesser) i wykrusza zęby węglikowe (Bosch). Wyjątek: Distar CS-X tylko z mikroudarem, w wiertnicy diamentowej.

2. WIERTŁO CENTRUJĄCE WYJMUJEMY. W koronach diamentowych (CS-X, Baumesser) po nacięciu pierwszych 5–10 mm, gdy korona złapie prowadzenie, wyjąć wiertło centrujące. Zostawione blokuje posuw w żelbecie i silikacie i daje bicie.

3. ZESZKLONA KORONA. Gdy diament przestaje brać w betonie lub silikacie, a krawędzie segmentów są gładkie i błyszczące, nie dociskać na siłę. Zrobić 2–3 płytkie nacięcia w miękkiej cegle, piaskowcu albo kostce do ostrzenia diamentu, żeby odsłonić świeże ziarna.

4. WŁAŚCIWA KORONA DO MATERIAŁU. Drogiego Distara CS-X nie używamy do miękkich ścian, a Boscha HM nie wpuszczamy w beton, silikat ani zbrojenie.`,src:"Standard firmowy EL'KADRA (Karol)",st:"do sprawdzenia",rel:"MN-0003, MN-0005",tab:"tabele",ig:"zasady"},
{id:"MN-0005",t:"Tarcza diamentowa: twardy czy ścierny materiał",tu:"Алмазний диск: твердий чи абразивний матеріал",c:"Narzędzia i materiały eksploatacyjne",tags:"#tarcza #bruzdownica #beton #cegła",b:"Zasada doboru spoiwa: materiał twardy (beton, beton zbrojony, granit) wymaga tarczy o miękkim spoiwie, a materiał miękki i ścierny (cegła, gazobeton, świeży beton) tarczy o twardym spoiwie. Zła tarcza w twardym materiale się szkli i przestaje ciąć, a w ściernym szybko się zużywa. Przeznaczenie jest opisane na tarczy i w katalogu.",src:"Do potwierdzenia w katalogu producenta tarcz",st:"do sprawdzenia"},
{id:"MN-0006",t:"Obciążalność przewodów: skąd brać dane",tu:"Допустимий струм проводів: де брати дані",c:"Normy i tabele",tags:"#obciążalność #przekrój #zabezpieczenie #PN-HD",b:"Obciążalność długotrwała zależy od przekroju, materiału żyły, izolacji (PVC lub XLPE), liczby obciążonych żył, sposobu ułożenia (metody A1, B2, C, E…), temperatury otoczenia i grupowania obwodów. Źródło normowe to PN-HD 60364-5-52. W tabeli wpisujemy wartości z katalogu producenta kabla, z numerem tabeli normy.",src:"PN-HD 60364-5-52; katalog producenta kabla (do uzupełnienia)",st:"do sprawdzenia"},

{"id": "MN-0009", "t": "Standard bruzdowania: dobór tarcz diamentowych Ø125", "tu": "Стандарт штроблення: підбір алмазних дисків Ø125", "c": "Narzędzia i materiały eksploatacyjne", "tags": "#tarcza #bruzda #bruzdownica #MFE40 #frez #porotherm #ytong #silka #beton", "b": "Standard EL'KADRA: bruzdownica Metabo MFE 40 (1900 W, otwór tarczy 22,23 mm) z odkurzaczem przemysłowym Starmix.\n\nŚCIĄGAWKA\n• Porotherm, pustak, Ytong, bloczki gipsowe, szerokie bruzdy pod wiązki → Metabo Dia-FS3 (3 rzędy): bruzda do 30 mm bez kucia środka.\n• Porotherm, pustak, Ytong, bloczki gipsowe, miękka cegła, węższe bruzdy → Metabo Dia-FS2 (2 rzędy): bruzda do 20 mm bez kucia, mniejszy opór.\n• Silikat (Silka), cegła pełna, beton, żelbet, a uniwersalnie wszystko → 2× Distar Technic Advanced: środek wybijany dłutem.\n\nMETABO DIA-FS3 (szerokie bruzdy)\nDuże ciągi i szerokie bruzdy do 30 mm pod wiązki przewodów w ceramice poryzowanej, pustakach z komorami, gazobetonie i bloczkach gipsowych. Wybiera od razu cały środek, bez kucia młotowiertarką. Nie używać w silikacie, pełnej cegle i betonie: przy szerokości 28,5 mm frez szybko się szkli, dusi MFE 40 i idzie wolniej niż para zwykłych tarcz z dłutem.\n\nMETABO DIA-FS2 (węższe bruzdy)\nStandardowe podejścia i węższe bruzdy do 20 mm w miękkich ścianach oraz tam, gdzie FS3 stawia za duży opór (np. twardsza cegła ceramiczna). Ma 20 segmentów zamiast 30 i o ponad 1/3 węższy pas cięcia (18 zamiast 28,5 mm): lżej prowadzi się na MFE 40 i wolniej zapycha urobkiem, a środka nadal nie trzeba kuć. Też nie wpuszczać jej w silikat ani beton.\n\nDISTAR TECHNIC ADVANCED (twarde ściany, wariant uniwersalny)\nPara tarcz do silikatu, pełnej cegły, betonu i sporadycznie żelbetu (wieńce, nadproża). Po nacięciu środek wybijamy dłutem w młotowiertarce. Najbardziej odporna na błędy tarcza w zestawie: segment spawany laserowo nie przegrzewa się pod zamkniętą osłoną bruzdownicy, a spoiwo nie znika od razu, jeśli ktoś dla kilku bruzd nie zmieni tarczy na FS2/FS3 i potnie nią Porotherm albo Ytong.\n\nZasady pracy (dwa przejścia, ostrzenie, odkurzacz, drogie frezy): MN-0010. Modele, indeksy i ceny: tabela tarcz.", "src": "Standard firmowy EL'KADRA (Karol). Metabo: karty produktów 628298000 i 628299000, dane MFE 40", "link": "https://www.metabo.com/au/en/accessories/cutting-grinding/diamond-channeling-discs/dia-cd2-125x18x22-23mm-professional-up-universal-628298000.html", "st": "do sprawdzenia", "rel": "MN-0010, MN-0005", "tab": "tabele", "ig": "tarcze", "d": "2026-11-21"},
{"id": "MN-0010", "t": "Bruzdowanie: złote zasady pracy", "tu": "Штроблення: золоті правила роботи", "c": "Narzędzia i materiały eksploatacyjne", "tags": "#tarcza #bruzdownica #ostrzenie #odkurzacz #frez", "b": "1. DWA PRZEJŚCIA. W głębokich bruzdach (30–40 mm) nie ciąć MFE 40 na pełną głębokość za jednym razem. Dwa przejścia po 15–20 mm wychodzą szybciej, nie duszą silnika i nie przegrzewają segmentów. Dotyczy zwłaszcza FS3 i FS2.\n\n2. ZESZKLONA TARCZA. Tarcza przestaje zbierać, grzeje ścianę, a krawędzie segmentów są gładkie i błyszczące: jest zeszklona albo zalepiona gipsem po bloczkach. Zrób 3–5 płytkich nacięć (5–10 mm) bez mocnego dociskania w kostce ściernej do diamentu (Mechanic 250×50×25 mm, w busie), w piaskowcu albo w miękkiej, ściernej cegle. FS3 i FS2 nacinaj w szerszą ściankę kostki (50 mm), żeby równo odsłonić wszystkie rzędy. Po ostrzeniu krawędź pod palcem ma być wyraźnie szorstka.\n\n3. SPRAWNY ODKURZACZ. FS3 wybiera ok. 6× więcej materiału niż dwie zwykłe tarcze (pas 28,5 mm zamiast 2× 2,2 mm), więc i pyłu jest tyle więcej. Gdy filtry w Starmixie są zapchane, urobek zostaje w bruździe i tarcza mieli własny pył. Przy nagłym spadku tempa najpierw otrząśnij i sprawdź filtry.\n\n4. SZANUJ DROGIE FREZY. FS2 i FS3 mają segment wysokości tylko 7 mm i kosztują 313–445 zł netto za sztukę. Na silikat i beton zawsze zakładamy parę Distar Technic Advanced (ok. 112 zł netto za parę): w twardym materiale i tak wyjdzie szybciej, a nie zniszczymy frezu.", "src": "Standard firmowy EL'KADRA (Karol)", "st": "do sprawdzenia", "rel": "MN-0009, MN-0004", "tab": "tabele", "ig": "tarcze-zasady", "d": "2026-11-21"},
{"id": "MN-0011", "t": "Ogranicznik przepięć: 3+1, 4+0 czy 3+0?", "tu": "Обмежувач перенапруг: 3+1, 4+0 чи 3+0?", "c": "Osprzęt i aparatura", "tags": "#SPD #przepięcia #ogranicznik #3+1 #4+0 #3+0 #TT #TN-S #RCD #rozdzielnica", "b": "Wybór między 3+1, 4+0 i 3+0 wynika z układu sieci, miejsca rozdziału PEN oraz tego, czy SPD stoi przed, czy za wyłącznikiem różnicowoprądowym (RCD).\n\nBUDOWA\n• 4+0 (układ CT1) → 4 jednakowe warystory do PE: L1–PE, L2–PE, L3–PE, N–PE.\n• 3+1 (układ CT2) → 3 warystory do N (L1–N, L2–N, L3–N) i iskiernik sumujący (GDT) między N–PE. W stanie spoczynku brak prądu upływu do PE.\n• 3+0 → 3 warystory do PEN: L1–PEN, L2–PEN, L3–PEN.\n\nKIEDY CO STOSOWAĆ\n• TT, SPD przed RCD → tylko 3+1. W TT pętla zwarcia przez ziemię ma zbyt dużą impedancję, żeby przepalić bezpiecznik po uszkodzeniu warystora L–PE. Iskiernik N–PE oddziela N od PE i nie ma upływu do ziemi. 4+0 przed RCD w TT jest niedopuszczalne (za RCD norma dopuszcza 4+0, ale w TT zawsze stosujemy 3+1).\n• TN-S albo TN-C-S z rozdziałem PEN w złączu (WLZ 5-żyłowy), SPD przed RCD → 4+0 lub 3+1. 4+0 daje niższe napięcie ochrony Up na ścieżce L–PE i zwykle jest tańszy. 3+1 bywa standardem uniwersalnym (pasuje też do TT) i nie daje upływu do PE przy starzeniu warystorów.\n• TN-S, SPD za RCD (np. za RCD selektywnym na wejściu) → 3+1. Brak upływu w spoczynku nie powoduje zbędnych zadziałań RCD, a przy zwarciu warystora L–N zadziała zabezpieczenie nadprądowe bez podawania potencjału na PE.\n• TN-C albo TN-C-S z rozdziałem PEN w tej rozdzielnicy (WLZ 4-żyłowy) → 3+0. Gdy mostek PE–N jest do 0,5 m od SPD, ścieżka N–PE i tak jest zwarta. 3+0 oszczędza 1 TE i koszty. 4+0 lub 3+1 to nie błąd, ale czwarta wkładka nie pracuje.\n\nSZYBKA REGUŁA\n• Rozdział PEN w rozdzielnicy (WLZ 4-żyłowy) → 3+0 (3 TE). Pod przyszłą wymianę WLZ na 5-żyłowy → 4+0 albo 3+1 (4 TE).\n• WLZ 5-żyłowy (TN-S), mieszkaniówka, SPD przed RCD → 4+0 (np. ETITEC M T2 300/20 4+0, OBO V20-4-280) albo uniwersalnie 3+1 (ETITEC M T2 300/20 3+1).\n• Sieć TT → tylko 3+1.", "src": "Notatka EL'KADRA (Karol) wg PN-HD 60364-5-534 (na poziomie europejskim zastąpionej przez HD 60364-5-53:2022). Przykładowe modele SPD do sprawdzenia w katalogach", "st": "do sprawdzenia", "rel": "", "ig": "spd", "d": "2026-11-26"}
];

 pl:[["Dwa przejścia","W głębokich bruzdach (30–40 mm) nie tnij MFE 40 na pełną głębokość za jednym razem. Dwa przejścia po 15–20 mm wychodzą szybciej, nie duszą silnika i nie przegrzewają segmentów. Dotyczy zwłaszcza FS3 i FS2."],["Zeszklona tarcza? Odśwież ją","Tarcza przestaje zbierać, grzeje ścianę, a krawędzie segmentów są gładkie i błyszczące: jest zeszklona albo zalepiona gipsem po bloczkach. Zrób 3–5 płytkich nacięć (5–10 mm) bez mocnego dociskania. FS3 i FS2 nacinaj w szerszą ściankę kostki (50 mm), żeby równo odsłonić wszystkie rzędy. Po ostrzeniu krawędź pod palcem ma być wyraźnie szorstka."],["Sprawny odkurzacz","FS3 wybiera ok. 6× więcej materiału niż dwie zwykłe tarcze (pas 28,5 mm zamiast 2× 2,2 mm), więc i pyłu jest tyle więcej. Gdy filtry w Starmixie są zapchane, urobek zostaje w bruździe i tarcza mieli własny pył. Przy nagłym spadku tempa najpierw otrząśnij i sprawdź filtry."],["Szanuj drogie frezy","FS2 i FS3 mają segment wysokości tylko 7 mm i kosztują 313–445 zł netto za sztukę. Na silikat i beton zawsze zakładamy parę Distar Technic Advanced (ok. 112 zł netto za parę): w twardym materiale i tak wyjdzie szybciej, a nie zniszczymy frezu."]],

 {t:"TN-C / PEN",s:["PEN w rozdzielnicy","PEN у цьому щиті"],k:"30",n:["WLZ 4-żyłowy, rozdział PEN w tej rozdzielnicy","4-жильний ввід, PEN розділяється в цьому щиті"],why:["Gdy PEN dzielisz w tej samej rozdzielnicy (mostek PE–N do 0,5 m od SPD), ścieżka N–PE i tak jest zwarta mostkiem. 3+0 oszczędza 1 TE i pieniądze.","Коли PEN розділяєш у тому самому щиті (перемичка PE–N до 0,5 м від ОПН), шлях N–PE і так закорочений перемичкою. 3+0 економить 1 модуль і гроші."],alt:["4+0 albo 3+1 to nie błąd, tylko czwarta wkładka nie pracuje. Warto, jeśli WLZ będzie wymieniany na 5-żyłowy.","4+0 або 3+1 — не помилка, просто четверта вставка не працює. Має сенс, якщо ввід замінять на 5-жильний."],no:null}
];
function spdTile(c){return `<svg viewBox="0 0 200 100" aria-hidden="true"><rect width="200" height="100" fill="#002e52"/><path d="M150 0h50v100h-80z" fill="#0b3d66"/><text x="16" y="52" font-size="${c.t.length>5?24:34}" font-family="Goldman,sans-serif" font-weight="700" fill="#fff">${c.t}</text><rect x="16" y="64" width="${c.s[lang==="ua"?1:0].length*6.6+14}" height="20" rx="3" fill="#fca311"/><text x="23" y="78" font-size="11" font-family="Roboto Mono,monospace" font-weight="700" fill="#000">${esc(c.s[lang==="ua"?1:0])}</text></svg>`}
function spdCard(){
  const g=SPD[lang],li=lang==="ua"?1:0,c=SPDC[sel.spd],b=g.b[c.k];
  return `<div class="kcard"><div class="kimg">${spdSvg(c.k)}</div><div><h3>${g.fit}: ${esc(b[0])}</h3><div class="idx">${esc(c.t)} · ${esc(c.s[li])} · ${esc(c.n[li])}</div>
  <dl><dt>${g.why}</dt><dd>${esc(c.why[li])}</dd><dt>${g.alt}</dt><dd>${esc(c.alt[li])}</dd></dl>
  ${c.no?`<div class="no"><b>${g.no}:</b> ${esc(c.no[li])}</div>`:""}</div></div>`;
}
function spdBlock(){
  const g=SPD[lang],li=lang==="ua"?1:0;
  return `<div class="ig"><h2>${g.h1}</h2><p class="lead">${g.h1s}</p>
  <div class="walls spd4" role="group">${SPDC.map((c,i)=>`<button type="button" class="wall ${i===sel.spd?"on":""}" data-s="spd" data-w="${i}" aria-pressed="${i===sel.spd}">${spdTile(c)}<span>${esc(c.n[li])}</span></button>`).join("")}</div>
  <div id="kc">${spdCard()}</div>
  <h2>${g.h2}</h2><p class="lead">${g.h2s}</p>
  <div class="rules spd3">${["40","31","30"].map(k=>`<div class="rule"><div class="spdfig">${spdSvg(k)}</div><h4>${esc(g.b[k][0])}</h4><p>${esc(g.b[k][1])}</p></div>`).join("")}</div>
  <div class="grind">${g.leg.map(([t,c])=>`<span><i style="display:inline-block;width:10px;height:10px;border:2px solid #002e52;background:${c};margin-right:6px;vertical-align:-1px"></i>${esc(t)}</span>`).join("")}</div>
  <h2>${g.h3}</h2><div class="rules">${g.rules.map((r,i)=>`<div class="rule ${i===2?"wide":""}"><span class="nr">${i+1}/3</span><h4>${esc(r[0])}</h4><p>${esc(r[1])}</p></div>`).join("")}</div></div>`;
}

const HS=[]; // termokurczki: zakresy średnic do uzupełnienia z katalogu
let lang="pl",q="",cat="";
try{lang=localStorage.getItem("mnemo-lang")||"pl"}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ua"||u==="pl")lang=u}catch(e){}
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=()=>T[lang];
const catName=c=>{const r=CAT.find(x=>x[0]===c);return r?(lang==="ua"?r[1]:r[0]):c};
const pill=s=>{const r=ST[s]||[s,s,""];return `<span class="pill ${r[2]}">${esc(lang==="ua"?r[1]:r[0])}</span>`};
const title=e=>lang==="ua"&&e.tu?esc(e.tu):esc(e.t)+(lang==="ua"?'<span class="fb">PL</span>':"");
const refs=s=>s.replace(/MN-\d{4}/g,m=>`<a href="#${m.toLowerCase()}">${m}</a>`);
function fmt(txt){
  return txt.split(/\n\s*\n/).map(block=>{
    const lines=block.split("\n");let out="",ul=[];
    const flush=()=>{if(ul.length){out+="<ul>"+ul.join("")+"</ul>";ul=[]}};
    for(const raw of lines){
      const l=esc(raw.trim());if(!l)continue;
      if(l.startsWith("• ")){const [a,...b]=l.slice(2).split(" → ");ul.push(`<li>${b.length?`<b>${a}</b> → ${refs(b.join(" → "))}`:refs(a)}</li>`);continue}
      flush();
      const num=l.match(/^(\d+\.\s[A-ZĄĆĘŁŃÓŚŹŻ\- ]+\.)\s(.*)$/);
      if(num){out+=`<p><b>${num[1]}</b> ${refs(num[2])}</p>`;continue}
      if(/^[A-ZĄĆĘŁŃÓŚŹŻ][A-ZĄĆĘŁŃÓŚŹŻ0-9 '\-]+(\s\(.+\))?$/.test(l)&&l.length<70){out+=`<h3>${l}</h3>`;continue}
      out+=`<p>${refs(l)}</p>`;
    }
    flush();return out;
  }).join("");
}
function tabs(route){
  const t=[["",L().entries],["tabele",L().tables],["kalkulator",L().calc]];
  $("#tabs").innerHTML=t.map(([h,n])=>`<a href="#${h}" class="${(route===h||(h===""&&route.startsWith("mn-")))?"on":""}">${esc(n)}</a>`).join("");
}
function matches(e){
  if(cat&&e.c!==cat)return false;
  if(!q)return true;
  const hay=[e.id,e.t,e.tu,e.c,catName(e.c),e.tags,e.b].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function list(){
  const r=E.filter(matches);
  $("#count").textContent=L().found(r.length);
  $("#list").innerHTML=r.length?r.map(e=>`<a class="card" href="#${e.id.toLowerCase()}"><span class="id">${e.id}</span><h2>${title(e)}</h2>${pill(e.st)}<span class="cat">/${esc(catName(e.c))}</span></a>`).join(""):`<div class="empty">${esc(L().none)}</div>`;
}
function home(){
  const used=CAT.filter(c=>E.some(e=>e.c===c[0]));
  app.innerHTML=`<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" autocomplete="off" placeholder="${esc(L().search)}" value="${esc(q)}" aria-label="${esc(L().search)}"></label>
  <div class="chips">${[["",L().all],...used.map(c=>[c[0],lang==="ua"?c[1]:c[0]])].map(([v,n])=>`<button type="button" class="chip ${cat===v?"on":""}" data-cat="${esc(v)}">${esc(n)}</button>`).join("")}</div>
  <p class="count" id="count"></p><div class="list" id="list"></div>`;
  $("#q").addEventListener("input",ev=>{q=ev.target.value;list()});
  app.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.cat;app.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));list()}));
  list();
}
function entry(id){
  const e=E.find(x=>x.id.toLowerCase()===id);
  if(!e){app.innerHTML=`<a class="back" href="#">${esc(L().back)}</a><div class="empty">${esc(L().notFound)}</div>`;return}
  const ua=lang==="ua",body=ua&&e.bu?e.bu:e.b;
  const rel=(e.rel||"").split(/,\s*/).filter(Boolean).map(r=>{const x=E.find(y=>y.id===r);return x?`<a href="#${r.toLowerCase()}">${r} · ${ua&&x.tu?esc(x.tu):esc(x.t)}</a>`:""}).join("<br>");
  app.innerHTML=`<a class="back" href="#">${esc(L().back)}</a><article class="art">
  <div class="meta1"><span>${e.id}</span><span>/${esc(catName(e.c))}</span>${pill(e.st)}</div>
  <h1>${ua&&e.tu?esc(e.tu):esc(e.t)}</h1>${ua&&e.tu?`<p class="meta1">${esc(e.t)}</p>`:""}
  ${ua&&!e.bu&&!e.ig?`<div class="note">${esc(L().fallback)}</div>`:""}
  ${e.ig?igBlock(e.ig)+`<details class="full"><summary>${esc(IGT[lang].full)}</summary><div class="body">${fmt(body)}</div></details>`:`<div class="body">${fmt(body)}</div>`}
  ${e.tab?`<a class="btn o" href="#${e.tab==="calc"?"kalkulator":"tabele"}">${esc(e.tab==="calc"?L().calc:L().openTab)} →</a>`:""}${e.link?`<a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">${esc(L().link)} ↗</a>`:""}
  <div class="tags">${e.tags.split(/\s+/).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
  <div class="meta2"><div><b>${esc(L().src)}</b>${esc(e.src)}</div><div><b>${esc(L().added)} · ${esc(L().date)}</b>Karol · ${e.d||"2026-11-19"}</div>${rel?`<div><b>${esc(L().rel)}</b>${rel}</div>`:""}</div>
  </article>`;
  app.querySelectorAll(".wall").forEach(btn=>btn.addEventListener("click",()=>{sel[btn.dataset.s]=+btn.dataset.w;app.querySelectorAll(".wall").forEach(x=>{x.classList.toggle("on",x===btn);x.setAttribute("aria-pressed",x===btn)});$("#kc").innerHTML=btn.dataset.s==="spd"?spdCard():kcard(btn.dataset.s)}));
  window.scrollTo(0,0);
}
function tables(){
  const c=L().cols;
  app.innerHTML=`<h2 class="sec">${esc(L().tTitle)}</h2><p class="lead">${refs(esc(L().tLead))}</p>
  <div class="scroll"><table class="stack"><thead><tr>${c.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>
  ${K.map(k=>`<tr class="${k.pick?"pick":""}"><td>${esc(k.m)}</td><td><b>${esc(k.p)}</b></td><td class="n">${esc(k.d)}</td><td>${esc(k.mo)}</td><td>${esc(k.u)}</td><td>${esc(k.n)}</td><td class="n">${k.c?k.c+" zł":""}</td><td>${pill(k.s)}</td></tr>`).join("")}
  </tbody></table></div>
  <h2 class="sec" style="margin-top:34px">${esc(L().t2Title)}</h2><p class="lead">${refs(esc(L().t2Lead))}</p>
  <div class="scroll"><table class="stack"><thead><tr>${L().cols2.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>
  ${K2.map(k=>`<tr class="${k.pick?"pick":""}"><td>${esc(k.m)}</td><td><b>${esc(k.p)}</b></td><td class="n">${esc(k.d)}</td><td>${esc(k.mo)}</td><td>${esc(k.u)}</td><td>${esc(k.n)}</td><td class="n">${k.c?k.c+" zł":""}</td><td>${pill(k.s)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function calc(){
  app.innerHTML=`<h2 class="sec">${esc(L().calc)}</h2><div class="calc">
  <div class="box"><label for="d">${esc(L().cLabel)}</label><input id="d" type="number" inputmode="decimal" min="0" step="0.1" placeholder="12,5"></div>
  <div class="box" aria-live="polite"><label>${esc(L().cHit)}</label><div class="res" id="r">${esc(L().cWait)}</div><p class="lead" id="r2"></p><a class="btn o" href="#mn-0001">${esc(L().cHow)} →</a></div></div>`;
  $("#d").addEventListener("input",ev=>{
    const v=parseFloat(String(ev.target.value).replace(",","."));
    if(!v){$("#r").textContent=L().cWait;$("#r2").textContent="";return}
    const hit=HS.filter(h=>v>=h.min&&v<=h.max);
    if(!HS.length){$("#r").textContent="Ø "+v+" mm";$("#r2").textContent=L().cEmpty;return}
    $("#r").textContent=hit.length?hit.map(h=>h.name).join(", "):"—";
  });
}
function render(){
  const route=decodeURIComponent(location.hash.slice(1)).toLowerCase();
  document.documentElement.lang=lang==="ua"?"uk":"pl";
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("#sub").textContent=L().sub;$("#foot").textContent=L().foot;
  tabs(route);
  if(route.startsWith("mn-"))entry(route);else if(route==="tabele")tables();else if(route==="kalkulator")calc();else home();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("mnemo-lang",lang)}catch(e){}render()}));
addEventListener("hashchange",render);
render();
}
</script>
</body>
</html>
