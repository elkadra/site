ŚCIĄGAWKA
• Żelbet, beton, silikat (Silka) → Distar CS-X Ø68, 4 segmenty, adapter M16 / SDS Plus. Zapas: Distar RS-X (tylko silka, bez mikroudaru).

DISTAR CS-X (twarde ściany)
Ciężki i zbrojony beton, twarde nadproża, gęste bloczki silikatowe. Nie wiercić w Porothermie, cegle ani Ytongu: miękkie spoiwo (pod zbrojenie) szybko ściera się w ściernym pyle ceramicznym. Zwykłą SDS+ bez mikroudaru: nie dociskać na siłę, lekko kołysać koroną na boki, żeby odprowadzać pył i łatwiej nacinać pręty.

BAUMESSER KRONE PRO (ceramika)

BOSCH EXPERT CONSTRUCTION MATERIAL (materiały miękkie)

2. WIERTŁO CENTRUJĄCE WYJMUJEMY. W koronach diamentowych (CS-X, Baumesser) po nacięciu pierwszych 5–10 mm, gdy korona złapie prowadzenie, wyjąć wiertło centrujące. Zostawione blokuje posuw w żelbecie i silikacie i daje bicie.

3. ZESZKLONA KORONA. Gdy diament przestaje brać w betonie lub silikacie, a krawędzie segmentów są gładkie i błyszczące, nie dociskać na siłę. Zrobić 2–3 płytkie nacięcia w miękkiej cegle, piaskowcu albo kostce do ostrzenia diamentu, żeby odsłonić świeże ziarna.

4. WŁAŚCIWA KORONA DO MATERIAŁU. Drogiego Distara CS-X nie używamy do miękkich ścian, a Boscha HM nie wpuszczamy w beton, silikat ani zbrojenie.`,src:"Standard firmowy EL'KADRA (Karol)",st:"do sprawdzenia",rel:"MN-0003, MN-0005",tab:"tabele",ig:"zasady"},
{id:"MN-0005",t:"Tarcza diamentowa: twardy czy ścierny materiał",tu:"Алмазний диск: твердий чи абразивний матеріал",c:"Narzędzia i materiały eksploatacyjne",tags:"#tarcza #bruzdownica #beton #cegła",b:"Zasada doboru spoiwa: materiał twardy (beton, beton zbrojony, granit) wymaga tarczy o miękkim spoiwie, a materiał miękki i ścierny (cegła, gazobeton, świeży beton) tarczy o twardym spoiwie. Zła tarcza w twardym materiale się szkli i przestaje ciąć, a w ściernym szybko się zużywa. Przeznaczenie jest opisane na tarczy i w katalogu.",src:"Do potwierdzenia w katalogu producenta tarcz",st:"do sprawdzenia"},

function rulesBlock(){
  const g=IGT[lang],li=lang==="ua"?1:0;
  return `<h2>${g.h2}</h2><p class="lead">${g.h2s}</p><div class="rules">${RULES[lang].map((r,i)=>i===2?`<div class="rule wide"><span class="nr">${i+1}/4</span><h4>${esc(r[0])}</h4><p>${esc(r[1])}</p><div class="ba"><figure><img src="${IMG_A}" alt=""><figcaption class="x">${esc(g.before)}</figcaption></figure><figure><img src="${IMG_B}" alt=""><figcaption class="v">${esc(g.after)}</figcaption></figure></div><div class="grind">${g.grind.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`:`<div class="rule">${ICO[i]}<span class="nr">${i+1}/4</span><h4>${esc(r[0])}</h4><p>${esc(r[1])}</p></div>`).join("")}</div>`;
}
function kcard(){
  const g=IGT[lang],li=lang==="ua"?1:0,k=IG[wsel];
  return `<div class="kcard"><div class="kimg"><img src="${PH[k.ph]}" alt="${esc(k.k)}"></div><div><h3>${esc(k.k)}</h3><div class="idx">${esc(k.i)}</div>
  <dl><dt>${g.mo}</dt><dd>${esc(k.mo[li])}</dd><dt>${g.ma}</dt><dd>${esc(k.ma[li])}</dd><dt>${g.alt}</dt><dd>${esc(k.alt[li])}</dd><dt>${g.pr}</dt><dd class="price">~${k.pr} zł</dd><dt>${g.tip}</dt><dd>${esc(k.tip[li])}</dd></dl>
  ${k.no?`<div class="no"><b>${g.no}:</b> ${esc(k.no[li])}</div>`:""}</div></div>`;
}
function igBlock(type){
  const g=IGT[lang],li=lang==="ua"?1:0;
  if(type==="zasady")return `<div class="ig">${rulesBlock()}</div>`;
  return `<div class="ig"><h2>${g.h1}</h2><p class="lead">${g.h1s}</p>
  <div class="walls" role="group">${IG.map((w,i)=>`<button type="button" class="wall ${i===wsel?"on":""}" data-w="${i}" aria-pressed="${i===wsel}">${WALL[w.w]}<span>${esc(w.n[li])}<small>${esc(w.s[li])}</small></span></button>`).join("")}</div>
  <div id="kc">${kcard()}</div>
  ${rulesBlock()}</div>`;
}
const HS=[]; // termokurczki: zakresy średnic do uzupełnienia z katalogu
let lang="pl",q="",cat="";
try{lang=localStorage.getItem("mnemo-lang")||"pl"}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ua"||u==="pl")lang=u}catch(e){}
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=()=>T[lang];
const catName=c=>{const r=CAT.find(x=>x[0]===c);return r?(lang==="ua"?r[1]:r[0]):c};
const pill=s=>{const r=ST[s]||[s,s,""];return `<span class="pill ${r[2]}">${esc(lang==="ua"?r[1]:r[0])}</span>`};
const title=e=>lang==="ua"&&e.tu?esc(e.tu):esc(e.t)+(lang==="ua"?'<span class="fb">PL</span>':"");
const refs=s=>s.replace(/MN-\d{4}/g,m=>`<a href="#${m.toLowerCase()}">${m}</a>`);
function fmt(txt){
  return txt.split(/\n\s*\n/).map(block=>{
    const lines=block.split("\n");let out="",ul=[];
    const flush=()=>{if(ul.length){out+="<ul>"+ul.join("")+"</ul>";ul=[]}};
    for(const raw of lines){
      const l=esc(raw.trim());if(!l)continue;
      if(l.startsWith("• ")){const [a,...b]=l.slice(2).split(" → ");ul.push(`<li>${b.length?`<b>${a}</b> → ${refs(b.join(" → "))}`:refs(a)}</li>`);continue}
      flush();
      const num=l.match(/^(\d+\.\s[A-ZĄĆĘŁŃÓŚŹŻ\- ]+\.)\s(.*)$/);
      if(num){out+=`<p><b>${num[1]}</b> ${refs(num[2])}</p>`;continue}
      if(/^[A-ZĄĆĘŁŃÓŚŹŻ][A-ZĄĆĘŁŃÓŚŹŻ0-9 '\-]+(\s\(.+\))?$/.test(l)&&l.length<70){out+=`<h3>${l}</h3>`;continue}
      out+=`<p>${refs(l)}</p>`;
    }
    flush();return out;
  }).join("");
}
function tabs(route){
  const t=[["",L().entries],["tabele",L().tables],["kalkulator",L().calc]];
  $("#tabs").innerHTML=t.map(([h,n])=>`<a href="#${h}" class="${(route===h||(h===""&&route.startsWith("mn-")))?"on":""}">${esc(n)}</a>`).join("");
}
function matches(e){
  if(cat&&e.c!==cat)return false;
  if(!q)return true;
  const hay=[e.id,e.t,e.tu,e.c,catName(e.c),e.tags,e.b].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function list(){
  const r=E.filter(matches);
  $("#count").textContent=L().found(r.length);
  $("#list").innerHTML=r.length?r.map(e=>`<a class="card" href="#${e.id.toLowerCase()}"><span class="id">${e.id}</span><h2>${title(e)}</h2>${pill(e.st)}<span class="cat">/${esc(catName(e.c))}</span></a>`).join(""):`<div class="empty">${esc(L().none)}</div>`;
}
function home(){
  const used=CAT.filter(c=>E.some(e=>e.c===c[0]));
  app.innerHTML=`<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" autocomplete="off" placeholder="${esc(L().search)}" value="${esc(q)}" aria-label="${esc(L().search)}"></label>
  <div class="chips">${[["",L().all],...used.map(c=>[c[0],lang==="ua"?c[1]:c[0]])].map(([v,n])=>`<button type="button" class="chip ${cat===v?"on":""}" data-cat="${esc(v)}">${esc(n)}</button>`).join("")}</div>
  <p class="count" id="count"></p><div class="list" id="list"></div>`;
  $("#q").addEventListener("input",ev=>{q=ev.target.value;list()});
  app.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.cat;app.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));list()}));
  list();
}
function entry(id){
  const e=E.find(x=>x.id.toLowerCase()===id);
  if(!e){app.innerHTML=`<a class="back" href="#">${esc(L().back)}</a><div class="empty">${esc(L().notFound)}</div>`;return}
  const ua=lang==="ua",body=ua&&e.bu?e.bu:e.b;
  const rel=(e.rel||"").split(/,\s*/).filter(Boolean).map(r=>{const x=E.find(y=>y.id===r);return x?`<a href="#${r.toLowerCase()}">${r} · ${ua&&x.tu?esc(x.tu):esc(x.t)}</a>`:""}).join("<br>");
  app.innerHTML=`<a class="back" href="#">${esc(L().back)}</a><article class="art">
  <div class="meta1"><span>${e.id}</span><span>/${esc(catName(e.c))}</span>${pill(e.st)}</div>
  <h1>${ua&&e.tu?esc(e.tu):esc(e.t)}</h1>${ua&&e.tu?`<p class="meta1">${esc(e.t)}</p>`:""}
  ${ua&&!e.bu&&!e.ig?`<div class="note">${esc(L().fallback)}</div>`:""}
  ${e.ig?igBlock(e.ig)+`<details class="full"><summary>${esc(IGT[lang].full)}</summary><div class="body">${fmt(body)}</div></details>`:`<div class="body">${fmt(body)}</div>`}
  ${e.tab?`<a class="btn o" href="#${e.tab==="calc"?"kalkulator":"tabele"}">${esc(e.tab==="calc"?L().calc:L().openTab)} →</a>`:""}${e.link?`<a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">${esc(L().link)} ↗</a>`:""}
  <div class="tags">${e.tags.split(/\s+/).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
  <div class="meta2"><div><b>${esc(L().src)}</b>${esc(e.src)}</div><div><b>${esc(L().added)} · ${esc(L().date)}</b>Karol · 2026-11-19</div>${rel?`<div><b>${esc(L().rel)}</b>${rel}</div>`:""}</div>
  </article>`;
  app.querySelectorAll(".wall").forEach(btn=>btn.addEventListener("click",()=>{wsel=+btn.dataset.w;app.querySelectorAll(".wall").forEach(x=>{x.classList.toggle("on",x===btn);x.setAttribute("aria-pressed",x===btn)});$("#kc").innerHTML=kcard()}));
  window.scrollTo(0,0);
}
function tables(){
  const c=L().cols;
  app.innerHTML=`<h2 class="sec">${esc(L().tTitle)}</h2><p class="lead">${refs(esc(L().tLead))}</p>
  <div class="scroll"><table class="stack"><thead><tr>${c.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>
  ${K.map(k=>`<tr class="${k.pick?"pick":""}"><td>${esc(k.m)}</td><td><b>${esc(k.p)}</b></td><td class="n">${esc(k.d)}</td><td>${esc(k.mo)}</td><td>${esc(k.u)}</td><td>${esc(k.n)}</td><td class="n">${k.c?k.c+" zł":""}</td><td>${pill(k.s)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function calc(){
  app.innerHTML=`<h2 class="sec">${esc(L().calc)}</h2><div class="calc">
  <div class="box"><label for="d">${esc(L().cLabel)}</label><input id="d" type="number" inputmode="decimal" min="0" step="0.1" placeholder="12,5"></div>
  <div class="box" aria-live="polite"><label>${esc(L().cHit)}</label><div class="res" id="r">${esc(L().cWait)}</div><p class="lead" id="r2"></p><a class="btn o" href="#mn-0001">${esc(L().cHow)} →</a></div></div>`;
  $("#d").addEventListener("input",ev=>{
    const v=parseFloat(String(ev.target.value).replace(",","."));
    if(!v){$("#r").textContent=L().cWait;$("#r2").textContent="";return}
    const hit=HS.filter(h=>v>=h.min&&v<=h.max);
    if(!HS.length){$("#r").textContent="Ø "+v+" mm";$("#r2").textContent=L().cEmpty;return}
    $("#r").textContent=hit.length?hit.map(h=>h.name).join(", "):"—";
  });
}
function render(){
  const route=decodeURIComponent(location.hash.slice(1)).toLowerCase();
  document.documentElement.lang=lang==="ua"?"uk":"pl";
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("#sub").textContent=L().sub;$("#foot").textContent=L().foot;
  tabs(route);
  if(route.startsWith("mn-"))entry(route);else if(route==="tabele")tables();else if(route==="kalkulator")calc();else home();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;try{localStorage.setItem("mnemo-lang",lang)}catch(e){}render()}));
addEventListener("hashchange",render);
render();
}
</script>
</body>
</html>
